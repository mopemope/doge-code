[package]
name = "dgc-cli"
description = "Command-line client for the dgc orchestrator daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dgc-next"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dgc-client.workspace = true
dgc-daemon.workspace = true
dgc-protocol.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
