[package]
name = "dgc-client"
description = "Client for the dgc orchestrator daemon socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dgc-daemon.workspace = true
dgc-protocol.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
