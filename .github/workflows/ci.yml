name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  tui-dependency-graph:
    name: TUI dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check active Crossterm generation
        shell: bash
        run: |
          set -euo pipefail
          # ratatui-crossterm keeps crossterm 0.28 as optional lock metadata;
          # qualify inverse-tree checks so that record is not mistaken for an active backend.
          cargo tree -i crossterm@0.29.0
          legacy_tree="$(cargo tree --all-features --target all -i crossterm@0.28.1 2>&1)"
          printf '%s\n' "$legacy_tree"
          if grep -q '^crossterm v0.28.1' <<<"$legacy_tree"; then
            echo "crossterm 0.28.1 is active in the dependency graph" >&2
            exit 1
          fi
