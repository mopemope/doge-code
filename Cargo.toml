[package]
name = "doge-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "dgc"
path = "src/main.rs"

[dependencies]
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
glob = "0.3"
toml = "1.1.6"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip", "brotli", "zstd", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "time", "process", "full"] }
dotenvy = "0.15"
dirs = "7.0"
tempfile = "3"

#bincode = "1"
# enable UUID v7 generation for session IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fastrand = "2"
diffy = "0.5.2"
blake3 = "1.5"
rust-embed = "8"
tera = "2.4"
num_cpus = "1.0"
ratatui = { version = "0.30.2", features = ["serde", "crossterm_0_29"] }

tokio-util = { version = "0.7", features = ["compat", "rt"] }
ignore = "0.4"
rand = "0.10.3"
humantime = "2.1"

# SeaORM for SQLite persistence
sea-orm = { version = "2.0.4", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
portable-pty = "0.9"
base64 = "0.23.1"
sha2 = "0.11"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
sea-orm-migration = { version = "2.0.4" }
async-trait = "0.1"
async-stream = "0.3"
notify = "8.2"
notify-rust = "4"
ratatui-textarea = { version = "0.9.2", features = ["crossterm"] }
ansi-to-tui = "8.0.1"
arboard = "3.4"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "client", "macros", "schemars", "transport-streamable-http-server", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-child-process", "reqwest"] }
axum = "0.8"
tower-http = { version = "0.7.1", features = ["limit"] }
schemars = "1.0"

url = "2.5.7"
percent-encoding = "2.3.2"
serde-saphyr = "1.3.0"
libc = "0.2"

[dev-dependencies]
httptest = "0.16"

