[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"

# Shared dependency versions for the crates under crates/. Add an entry here
# when a crate first needs it; crates enable the features they use.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dgc-client = { path = "crates/dgc-client" }
dgc-daemon = { path = "crates/dgc-daemon" }
dgc-protocol = { path = "crates/dgc-protocol" }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2"
toml = "1.1.8"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1.28.0", default-features = false }
